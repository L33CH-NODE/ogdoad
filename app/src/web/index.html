<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ogdoad</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Paint the chosen skin before anything renders, so there's no flash of the wrong one.
      try {
        var skin = localStorage.getItem("ogdoad.skin");
        if (skin) document.documentElement.dataset.skin = skin;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
